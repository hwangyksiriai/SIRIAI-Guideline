<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Siriai Campaign Guide</title>
<link rel="icon" href="assets/symbol-black.png">
<style>
/* ── Tokens: 포트폴리오(globals.css)와 동일 ───────────────────── */
:root{
  --bg:#ffffff; --ink:#171310; --muted:#6f6a5c; --accent:#fa233b;
  --line:#e4ded2; --card:#f5f2ec; --accent-soft:rgba(250,35,59,.14); --shell-bg:#ebeae7;
  --ok:#1a9e5c; --ok-soft:rgba(26,158,92,.12);
  --font:-apple-system,"SF Pro Text","Inter Tight","Noto Sans KR",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
html,body{ margin:0; padding:0; }
body{ background:var(--shell-bg); color:var(--ink); font-family:var(--font); overflow-x:hidden; word-break:keep-all; overflow-wrap:break-word; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
button,input,textarea,select{ font-family:inherit; }
body.lock{ overflow:hidden; }

.shell{ max-width:560px; margin:0 auto; padding:8px 8px 96px; display:flex; flex-direction:column; gap:8px; }
section{ scroll-margin-top:76px; }

/* ── Top bar ─────────────────────────────────────────── */
.topbar{ position:sticky; top:8px; z-index:30; display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg); border-radius:16px; }
.logo{ display:flex; align-items:center; gap:9px; flex:0 0 auto; background:none; border:none; padding:0; cursor:pointer; }
.logo .mark{ width:24px; height:24px; object-fit:contain; }
.logo .word{ height:14px; width:auto; display:block; }
.nav{ display:flex; gap:4px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
.nav::-webkit-scrollbar{ display:none; }
.nav-item{ display:flex; align-items:center; gap:8px; flex:0 0 auto; white-space:nowrap; padding:8px 12px; border-radius:10px; border:none; background:none; cursor:pointer; font-size:14px; font-weight:500; color:var(--ink); transition:background .15s, color .15s; }
.nav-item svg{ width:16px; height:16px; stroke:currentColor; stroke-width:1.6; fill:none; flex:0 0 auto; }
.nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:700; }

.panel-card{ background:var(--bg); border-radius:16px; padding:24px 20px; }

/* 화면 전환: main(소개+가이드) ↔ apply(지원서) */
body[data-view="apply"] #top, body[data-view="apply"] #guide{ display:none; }
body[data-view="main"] #apply{ display:none; }
body[data-view="apply"] #apply{ animation:fadeIn .35s cubic-bezier(.16,1,.3,1); min-height:calc(100svh - 92px); }
.back{ display:inline-flex; align-items:center; gap:6px; margin:0 0 18px -4px; padding:6px 10px 6px 6px; border:none; background:var(--card); border-radius:999px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; }
.back svg{ width:16px; height:16px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

/* 가이드 안 브랜드 탭 — 포트폴리오 '색조·스킨·해외' 버튼과 동일 */
.g-chips{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 0 16px; }
.g-chips::-webkit-scrollbar{ display:none; }

/* ── 1. Hero (포트폴리오 홈과 동일) ───────────────────────── */
.hero{ min-height:calc(100svh - 92px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:56px 24px 40px; }
.hero .brand{ height:20px; margin:0 auto 16px; display:block; }
.hero h1{ font-weight:700; letter-spacing:-.02em; font-size:30px; line-height:1.2; margin:0 0 28px; }
.hero .sym{ width:88px; height:88px; margin:0 auto 28px; display:block; filter:drop-shadow(0 12px 24px rgba(0,0,0,.15)); }
.hero p{ font-size:14px; line-height:1.7; color:var(--muted); margin:0; }
.scroll-cue{ margin-top:44px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.06em; background:none; border:none; cursor:pointer; }
.scroll-cue svg{ width:18px; height:18px; stroke:var(--muted); stroke-width:2; fill:none; animation:bob 1.6s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(5px); } }

/* ── 2. Brand guide ─────────────────────────────────────── */
.guide-head{ border-bottom:1px solid var(--line); margin-bottom:16px; }
.eyebrow{ font-size:11px; font-weight:800; color:var(--accent); letter-spacing:.06em; margin:0 0 8px; }
.g-title{ font-weight:700; letter-spacing:-.02em; font-size:26px; margin:0 0 6px; }
.g-desc{ font-size:13.5px; line-height:1.6; color:var(--muted); margin:0; }
.marquee{ position:relative; margin:0 -4px; padding:14px 0; overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent); }
.track{ display:flex; align-items:center; gap:18px; width:max-content; animation:marquee 140s linear infinite; }
.m-item{ display:flex; align-items:center; gap:18px; white-space:nowrap; }
.m-label{ font-weight:900; font-size:24px; letter-spacing:-.01em; color:rgba(23,19,16,.34); }
.m-dot{ color:var(--line); font-size:10px; }
@keyframes marquee{ to{ transform:translateX(-50%); } }
.shine{ position:absolute; inset:0; display:flex; align-items:center; pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,transparent 44%,#000 50%,transparent 56%,transparent); -webkit-mask-size:260% 100%; -webkit-mask-repeat:no-repeat;
  mask-image:linear-gradient(90deg,transparent,transparent 44%,#000 50%,transparent 56%,transparent); mask-size:260% 100%; mask-repeat:no-repeat;
  animation:shine 5.5s linear infinite; }
.shine .m-label{ background:linear-gradient(90deg,#ff8a00,#ff3d81,#a239ff,#ff3d81,#ff8a00); -webkit-background-clip:text; background-clip:text; color:transparent; }
.shine .m-dot{ color:transparent; }
@keyframes shine{ from{ -webkit-mask-position:-160% 0; mask-position:-160% 0; } to{ -webkit-mask-position:160% 0; mask-position:160% 0; } }

.guide-body{ display:flex; flex-direction:column; gap:10px; animation:fadeIn .35s cubic-bezier(.16,1,.3,1); }
@keyframes fadeIn{ from{ transform:translateX(40px); opacity:0; } to{ transform:none; opacity:1; } }

/* 레퍼런스 릴스 2개 — 포트폴리오 clip 카드와 동일 */
.reels{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.clip{ position:relative; aspect-ratio:9/16; border-radius:4px; overflow:hidden; background:var(--card); border:1px solid var(--line); }
.clip video,.clip img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.clip.empty{ background:transparent; border-style:dashed; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.clip.empty .plus{ width:26px; height:26px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }
.clip.empty .lbl{ font-size:10px; color:var(--muted); letter-spacing:.03em; }
.clip-badge{ position:absolute; top:10px; left:10px; z-index:2; font-size:10.5px; font-weight:700; letter-spacing:.03em; color:#fff; background:rgba(23,19,16,.65); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:4px 9px; border-radius:999px; }

.box{ border:1px solid var(--line); border-radius:16px; padding:18px 16px; }
.facts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.fact .k{ font-size:11.5px; color:var(--muted); margin-bottom:6px; }
.fact .v{ font-size:14.5px; font-weight:700; line-height:1.35; }
.box-h{ display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; margin:0 0 14px; }
.box-h svg{ width:22px; height:22px; stroke:var(--ink); stroke-width:1.7; fill:none; flex:0 0 auto; }
.inner{ background:var(--card); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; }
.inner + .step, .inner + .inner{ margin-top:14px; }
.inner-h{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; padding:2px 2px 0; }
.ok{ width:22px; height:22px; border-radius:50%; background:var(--ok-soft); display:grid; place-items:center; flex:0 0 auto; }
.ok svg, .li svg{ width:13px; height:13px; stroke:var(--ok); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.hash{ width:22px; text-align:center; color:var(--ok); font-weight:800; font-size:16px; }
.li{ display:flex; gap:10px; align-items:flex-start; background:#fff; border-radius:10px; padding:11px 12px; font-size:13.5px; line-height:1.55; }
.li svg{ margin-top:4px; flex:0 0 auto; }
.step{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--muted); margin:2px 0 10px; }
.step .n{ width:24px; height:24px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--ink); }
.copy{ display:inline-flex; align-items:center; gap:8px; align-self:flex-start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; transition:border-color .15s, color .15s; }
.copy svg{ width:15px; height:15px; stroke:var(--muted); stroke-width:1.8; fill:none; }
.copy.done{ border-color:var(--accent); color:var(--accent); }
.icon-copy{ background:none; border:none; padding:2px; cursor:pointer; display:grid; place-items:center; }
.icon-copy svg{ width:16px; height:16px; stroke:var(--muted); stroke-width:1.8; fill:none; }
.icon-copy.done svg{ stroke:var(--accent); }

.cta{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:16px; border-radius:999px; border:none; cursor:pointer; font-size:16px; font-weight:800; color:#fff; background:var(--accent); box-shadow:0 12px 30px -8px rgba(250,35,59,.55); transition:filter .15s, transform .15s; }
.cta:hover{ filter:brightness(1.06); }
.cta:active{ transform:scale(.98); }
.cta svg{ width:18px; height:18px; stroke:#fff; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.cta:disabled{ opacity:.55; cursor:default; box-shadow:none; }

/* ── 3. Apply form ─────────────────────────────────────── */
.f-title{ font-weight:700; letter-spacing:-.02em; font-size:22px; margin:0 0 6px; }
.f-desc{ font-size:13px; color:var(--muted); margin:0 0 20px; line-height:1.6; }
.group{ border:1px solid var(--line); border-radius:16px; padding:16px 14px 4px; margin-bottom:10px; }
.group-h{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin:0 0 14px; }
.group-h .n{ width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:800; }
.group-h small{ margin-left:auto; font-size:11px; font-weight:600; color:var(--muted); }
.field{ display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
.field label{ font-size:12.5px; font-weight:700; }
.field label i{ color:var(--accent); font-style:normal; margin-left:2px; }
.input{ width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:15px; color:var(--ink); outline:none; transition:border-color .15s, background .15s; }
.input:focus{ border-color:var(--accent); background:#fff; }
.input.bad{ border-color:var(--accent); }
textarea.input{ resize:vertical; min-height:84px; line-height:1.5; }
.brand-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.bchip{ padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-weight:600; font-size:13px; color:var(--muted); cursor:pointer; transition:background .15s, color .15s, border-color .15s; }
.bchip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.consent{ display:flex; gap:10px; align-items:flex-start; font-size:12.5px; line-height:1.55; color:var(--muted); margin:6px 0 18px; cursor:pointer; }
.consent input{ appearance:none; -webkit-appearance:none; flex:0 0 20px; width:20px; height:20px; margin:0; border-radius:6px; border:1.5px solid var(--line); background:var(--card); display:grid; place-items:center; cursor:pointer; }
.consent input:checked{ background:var(--accent); border-color:var(--accent); }
.consent input:checked::after{ content:""; width:9px; height:5px; border:2px solid #fff; border-top:none; border-right:none; transform:rotate(-45deg) translate(1px,-1px); }
.err{ font-size:12px; color:var(--accent); margin:-6px 0 14px; display:none; }
.done-box{ text-align:center; padding:28px 8px; }
.done-box .ok{ width:56px; height:56px; margin:0 auto 16px; }
.done-box .ok svg{ width:26px; height:26px; }
.done-box h3{ font-size:19px; margin:0 0 8px; }
.done-box p{ font-size:13.5px; color:var(--muted); margin:0 0 20px; line-height:1.6; }
.ghost{ background:var(--card); border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; color:var(--ink); }

/* ── FAB + 브랜드 시트 ─────────────────────────────────── */
.fab{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:40; width:48px; height:48px; border-radius:50%; border:none; background:var(--accent); box-shadow:0 12px 30px -6px rgba(250,35,59,.6); display:grid; place-items:center; cursor:pointer; transition:transform .2s; }
.fab svg{ width:20px; height:20px; stroke:#fff; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.fab-tip{ position:fixed; bottom:72px; left:50%; transform:translateX(-50%); z-index:40; white-space:nowrap; font-size:12px; font-weight:700; color:var(--ink); padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.7); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.6); box-shadow:0 8px 20px -10px rgba(0,0,0,.25); pointer-events:none; transition:opacity .3s; }
.fab-tip.hide{ opacity:0; }

.scrim{ position:fixed; inset:0; z-index:50; background:rgba(23,19,16,.28); opacity:0; pointer-events:none; transition:opacity .25s; }
.scrim.open{ opacity:1; pointer-events:auto; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:51; max-width:560px; margin:0 auto; max-height:78svh; display:flex; flex-direction:column;
  background:rgba(255,255,255,.86); backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-radius:22px 22px 0 0; box-shadow:0 -12px 40px -12px rgba(0,0,0,.25);
  transform:translateY(105%); transition:transform .38s cubic-bezier(.16,1,.3,1); padding:10px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet.open{ transform:none; }
.grab{ width:38px; height:5px; border-radius:99px; background:rgba(23,19,16,.18); margin:0 auto 14px; }
.sheet-h{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 12px; }
.sheet-h h2{ font-size:19px; margin:0; letter-spacing:-.02em; }
.sheet-h span{ font-size:12px; font-weight:700; color:var(--accent); }
.sheet-list{ overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-bottom:4px; }
.b-item{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px; border-radius:14px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); transition:border-color .15s; }
.b-item.active{ border-color:var(--accent); }
.b-mono{ width:44px; height:44px; flex:0 0 auto; border-radius:12px; display:grid; place-items:center; font-weight:900; font-size:15px; color:#fff; letter-spacing:-.02em; }
.b-text{ flex:1; min-width:0; }
.b-text b{ display:block; font-size:15px; margin-bottom:3px; }
.b-text span{ display:block; font-size:12.5px; color:var(--muted); line-height:1.45; }
.b-meta{ display:flex; gap:5px; margin-top:7px; flex-wrap:wrap; }
.b-meta em{ font-style:normal; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--card); color:var(--muted); }
.b-meta em.hot{ background:var(--accent-soft); color:var(--accent); }
.b-item > svg{ width:18px; height:18px; stroke:var(--muted); stroke-width:2; fill:none; flex:0 0 auto; }

.toast{ position:fixed; top:84px; left:50%; transform:translate(-50%,-10px); z-index:60; background:var(--ink); color:#fff; font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (min-width:600px){ .shell{ padding:16px 16px 100px; } .topbar{ top:16px; } .panel-card{ padding:32px 28px; } }
</style>
</head>
<body data-view="main">
<div class="shell">
  <header class="topbar">
    <button class="logo" data-go="top" aria-label="맨 위로"><img class="mark" src="assets/symbol-black.png" alt=""><img class="word" src="assets/logo-wordmark.png" alt="Siriai"></button>
    <nav class="nav" id="nav"></nav>
  </header>

  <!-- 1. 소개 -->
  <section class="panel-card hero" id="top">
    <img class="brand" src="assets/logo-wordmark-grey.png" alt="Siriai">
    <h1>감각적인 비주얼을<br>만나보세요.</h1>
    <img class="sym" src="assets/symbol-black.png" alt="">
    <p>시리아이가 진행 중인 캠페인을 확인하고<br>원하는 브랜드에 지원해보세요.</p>
    <button class="scroll-cue" data-go="guide">SCROLL<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </section>

  <!-- 2. 브랜드 가이드 -->
  <section class="panel-card" id="guide"></section>

  <!-- 3. 지원서 -->
  <section class="panel-card" id="apply"></section>
</div>

<div class="fab-tip" id="fabTip">진행 중인 브랜드 보기</div>
<button class="fab" id="fab" aria-label="진행 중인 브랜드 보기" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="진행 중인 캠페인">
  <div class="grab"></div>
  <div class="sheet-h"><h2>진행 중인 캠페인</h2><span id="sheetCount"></span></div>
  <div class="sheet-list" id="sheetList"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 이 파일은 인플루언서에게 그대로 공개돼요. 금액·내부 안내는 적지 마세요.
   운영 방법은 내부 허브 페이지에 있어요. */
const SUBMIT_URL = '';

const PAGE =(new URLSearchParams(location.search).get('p') || '').trim().slice(0, 20);

/* 브랜드 내용은 brands.json 에 있어요 (어드민 페이지에서 수정). */
let PAST_BRANDS = [];
let BRANDS = [];

async function sha256hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
async function loadData(){
  const res = await fetch('brands.json?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('brands.json ' + res.status);
  const data = await res.json();
  PAST_BRANDS = data.pastBrands || [];
  const TBD = ['별도 가이드로 전달 예정입니다.'];
  const all = (data.brands || []).filter((b) => b && b.id && b.name).map((b) => ({
    category: '뷰티', color: '#171310', hashNote: '광고 표기를 멘션 맨 앞에 배치',
    ...b,
    deadline: b.deadline || '상시 모집',
    make: b.make?.filter(Boolean).length ? b.make.filter(Boolean) : TBD,
    upload: b.upload?.filter(Boolean).length ? b.upload.filter(Boolean) : TBD,
    reels: [0, 1].map((i) => (b.reels || [])[i] || ''),
    facts: [['유형', '릴스'], ['제공', b.reward || '제품'], ['모집', b.quota || '상시']],
  }));
  /* 고료 링크별 노출: 코드 대신 해시로 비교해서 공개 파일에 코드가 드러나지 않게 */
  const pageHash = PAGE ? await sha256hex('siriai-tier:' + PAGE) : '';
  BRANDS = all.filter((b) => !b.tierHashes?.length || b.tierHashes.includes(pageHash));
}

/* ── helpers ── */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const I = {
  home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h12V10"/>',
  drop: '<path d="M12 3c3 4 6 7.6 6 11.2A6 6 0 1 1 6 14.2C6 10.6 9 7 12 3Z"/>',
  camera: '<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8.5 7l1.3-2.5h4.4L15.5 7"/><circle cx="12" cy="13.5" r="3.5"/>',
  upload: '<path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
const li = (t) => `<div class="li">${svg('check')}<span>${esc(t)}</span></div>`;

let current = '';
const brand = () => BRANDS.find((b) => b.id === current) || BRANDS[0];

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1400);
}

/* ── Top nav: Home ── */
let view = 'main';
let section = 'top';   // main 화면에서 지금 보이는 곳: top | guide
function renderNav(){
  const active = view === 'apply' ? 'apply' : section;
  const items = [['top', 'home', 'Home']];
  $('nav').innerHTML = items.map(([id, icon, label]) =>
    `<button class="nav-item${id === active ? ' active' : ''}" data-go="${id}">${svg(icon)}${label}</button>`).join('');
}

/* ── 2. 가이드 ── */
function renderGuide(){
  const b = brand();
  const items = [...PAST_BRANDS, ...PAST_BRANDS].map((w) => `<span class="m-item"><span class="m-label">${esc(w)}</span><span class="m-dot">•</span></span>`).join('');
  $('guide').innerHTML = `
    <div class="guide-head">
      <p class="eyebrow">CONTENTS GUIDE · ${esc(b.deadline)}</p>
      <h2 class="g-title">${esc(b.name)}</h2>
      <p class="g-desc">${esc(b.summary)}</p>
      <div class="marquee"><div class="track">${items}</div><div class="shine" aria-hidden="true"><div class="track">${items}</div></div></div>
    </div>
    ${BRANDS.length > 1 ? `<div class="g-chips">${BRANDS.map((x) =>
      `<button class="bchip${x.id === b.id ? ' active' : ''}" data-brand="${x.id}">${esc(x.name)}</button>`).join('')}</div>` : ''}
    <div class="guide-body" key="${b.id}">
      <div class="reels">${b.reels.map((src, i) => src
        ? `<div class="clip"><span class="clip-badge">REF ${i + 1}</span>${/\.(mp4|mov|webm)$/i.test(src) ? `<video src="${esc(src)}" autoplay muted loop playsinline></video>` : `<img src="${esc(src)}" alt="">`}</div>`
        : `<div class="clip empty"><span class="clip-badge">REF ${i + 1}</span><span class="plus">+</span><span class="lbl">레퍼런스 릴스</span></div>`).join('')}</div>
      <div class="box facts">${b.facts.map(([k, v]) => `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>

      <div class="box">
        <h3 class="box-h">${svg('camera')}이렇게 제작해 주세요</h3>
        <div class="inner">
          <div class="inner-h"><span class="ok">${svg('check')}</span>필수사항</div>
          ${b.make.map(li).join('')}
        </div>
      </div>

      <div class="box">
        <h3 class="box-h">${svg('upload')}이렇게 업로드해 주세요</h3>
        <div class="step"><span class="n">1</span>계정을 태그해 주세요</div>
        <div class="inner"><button class="copy" data-copy="${esc(b.account)}">${esc(b.account)}${svg('copy')}</button></div>
        <div class="step" style="margin-top:16px"><span class="n">2</span>캡션은 이렇게 작성해 주세요</div>
        <div class="inner">
          <div class="inner-h"><span class="hash">#</span>필수 해시태그<button class="icon-copy" data-copy="${esc(b.hashtags)}" aria-label="해시태그 복사">${svg('copy')}</button></div>
          ${li(b.hashtags + (b.hashNote ? ` (${b.hashNote})` : ''))}
          <div class="inner-h" style="margin-top:6px"><span class="ok">${svg('check')}</span>필수사항</div>
          ${b.upload.map(li).join('')}
        </div>
      </div>

      <button class="cta" data-go="apply" style="margin-top:6px">${esc(b.name)} 지원서 작성하기${svg('arrow')}</button>
    </div>`;
}

/* ── 3. 지원서 ── */
function renderApply(){
  $('apply').innerHTML = `
    <button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>${esc(brand().name)} 가이드로</button>
    <p class="eyebrow">APPLY</p>
    <h2 class="f-title">캠페인 지원하기</h2>
    <p class="f-desc">한 번만 입력하면 선정 즉시 제품 발송·촬영 안내까지 바로 진행돼요.</p>
    <form id="form" novalidate>
      <div class="group">
        <h3 class="group-h"><span class="n">1</span>지원 브랜드<small>복수 선택 가능</small></h3>
        <div class="field"><div class="brand-chips" id="bchips"></div></div>
      </div>
      <div class="group">
        <h3 class="group-h"><span class="n">2</span>기본 정보</h3>
        <div class="field"><label for="f-name">이름<i>*</i></label>
          <input class="input" id="f-name" name="name" autocomplete="name" placeholder="홍길동"></div>
        <div class="field"><label for="f-phone">연락처<i>*</i></label>
          <input class="input" id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000"></div>
        <div class="field"><label for="f-email">이메일</label>
          <input class="input" id="f-email" name="email" type="email" autocomplete="email" placeholder="name@email.com"></div>
      </div>
      <div class="group">
        <h3 class="group-h"><span class="n">3</span>채널 정보</h3>
        <div class="two">
          <div class="field"><label for="f-insta">인스타그램 계정<i>*</i></label>
            <input class="input" id="f-insta" name="instagram" placeholder="@account" autocapitalize="off"></div>
          <div class="field"><label for="f-fol">팔로워 수<i>*</i></label>
            <input class="input" id="f-fol" name="followers" inputmode="numeric" placeholder="예) 12,000"></div>
        </div>
      </div>
      <div class="group">
        <h3 class="group-h"><span class="n">4</span>배송 정보<small>선정 시 바로 발송</small></h3>
        <div class="field"><label for="f-addr">받으실 주소<i>*</i></label>
          <input class="input" id="f-addr" name="address" autocomplete="street-address" placeholder="도로명 주소, 상세 주소"></div>
      </div>
      <div class="field" style="margin-top:6px"><label for="f-msg">하고 싶은 말 (선택)</label>
        <textarea class="input" id="f-msg" name="message" placeholder="이 브랜드에 지원하는 이유, 기획하고 싶은 콘텐츠 등"></textarea></div>
      <label class="consent"><input type="checkbox" id="f-agree"><span>캠페인 진행을 위한 개인정보(이름, 연락처, SNS 계정, 이메일, 주소) 수집·이용에 동의합니다. 수집된 정보는 캠페인 종료 후 파기됩니다.</span></label>
      <p class="err" id="err"></p>
      <button class="cta" type="submit" id="submit">지원하기${svg('arrow')}</button>
    </form>`;
  renderBrandChips();
  $('form').addEventListener('submit', onSubmit);
  $('form').addEventListener('input', (e) => e.target.classList.remove('bad'));
}

let picked = new Set([current]);
function renderBrandChips(){
  const box = $('bchips'); if (!box) return;
  box.innerHTML = BRANDS.map((b) => `<button type="button" class="bchip${picked.has(b.id) ? ' active' : ''}" data-pick="${b.id}">${esc(b.name)}</button>`).join('');
}

async function onSubmit(e){
  e.preventDefault();
  const f = e.target, err = $('err');
  const data = {
    brands: BRANDS.filter((b) => picked.has(b.id)).map((b) => b.name),
    name: f.name.value.trim(), phone: f.phone.value.trim(),
    instagram: f.instagram.value.trim(), followers: f.followers.value.trim(),
    email: f.email.value.trim(), address: f.address.value.trim(), message: f.message.value.trim(),
    page: PAGE,
    submittedAt: new Date().toISOString(),
  };
  const bad = [];
  if (!data.name) bad.push(f.name);
  if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(data.phone)) bad.push(f.phone);
  if (!data.instagram) bad.push(f.instagram);
  if (!data.followers) bad.push(f.followers);
  if (!data.address) bad.push(f.address);
  if (data.email && !/^\S+@\S+\.\S+$/.test(data.email)) bad.push(f.email);
  bad.forEach((el) => el.classList.add('bad'));
  let msg = '';
  if (!data.brands.length) msg = '지원할 브랜드를 하나 이상 선택해주세요.';
  else if (bad.length) msg = '표시된 항목을 확인해주세요.';
  else if (!$('f-agree').checked) msg = '개인정보 수집·이용에 동의해주세요.';
  err.textContent = msg; err.style.display = msg ? 'block' : 'none';
  if (msg) { (bad[0] || err).scrollIntoView({ block:'center', behavior:'smooth' }); return; }

  const btn = $('submit'); btn.disabled = true; btn.firstChild.textContent = '접수 중...';
  try {
    if (SUBMIT_URL) {
      // text/plain 으로 보내야 Apps Script 웹 앱이 CORS 사전요청 없이 받아요.
      const res = await fetch(SUBMIT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
      if (!res.ok) throw new Error('failed');
      const out = await res.json().catch(() => ({ ok: true }));
      if (out.ok === false) throw new Error(out.error || 'failed');
    } else {
      try { const all = JSON.parse(localStorage.getItem('siriai-applications') || '[]'); all.push(data); localStorage.setItem('siriai-applications', JSON.stringify(all)); } catch {}
    }
    $('apply').innerHTML = `<div class="done-box">
      <div class="ok">${svg('check')}</div>
      <h3>지원이 완료되었어요</h3>
      <p>${esc(data.brands.join(', '))} 캠페인 지원이 접수되었습니다.<br>선정 시 ${esc(data.phone)} 로 연락드릴게요.</p>
      <button class="ghost" id="again">다른 브랜드도 보기</button></div>`;
    $('again').onclick = () => { renderApply(); openSheet(); };
  } catch {
    btn.disabled = false; btn.firstChild.textContent = '지원하기';
    err.textContent = '접수에 실패했어요. 잠시 후 다시 시도해주세요.'; err.style.display = 'block';
  }
}

/* ── 시트 ── */
function renderSheet(){
  $('sheetCount').textContent = `${BRANDS.length}개 브랜드`;
  $('sheetList').innerHTML = BRANDS.map((b) => `
    <button class="b-item${b.id === current ? ' active' : ''}" data-brand="${b.id}">
      <span class="b-mono" style="background:${esc(b.color)}">${esc(b.name.slice(0, 2))}</span>
      <span class="b-text"><b>${esc(b.name)}</b><span>${esc(b.summary)}</span>
        <span class="b-meta"><em class="${b.hot ? 'hot' : ''}">${esc(b.deadline)}</em><em>${esc(b.facts[0][1])}</em><em>${esc(b.category)}</em></span></span>
      ${svg('chev')}
    </button>`).join('');
}
function openSheet(){
  renderSheet();
  $('sheet').classList.add('open'); $('scrim').classList.add('open'); document.body.classList.add('lock');
  $('fab').setAttribute('aria-expanded', 'true'); $('fabTip').classList.add('hide');
}
function closeSheet(){
  $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); document.body.classList.remove('lock');
  $('fab').setAttribute('aria-expanded', 'false');
}

/* ── 화면 전환 ──
   주소: #브랜드 → 소개+가이드 화면 / #apply/브랜드 → 지원서 화면 (뒤로가기로 가이드 복귀) */
function setView(v){
  view = v;
  document.body.dataset.view = v;
  renderNav();
  requestAnimationFrame(syncSection);
}
function selectBrand(id, scroll = true){
  current = id;
  picked = new Set([id]);
  if (view === 'apply') setView('main');
  renderGuide(); renderApply();
  history.replaceState({}, '', '#' + id);
  if (scroll) $('guide').scrollIntoView({ behavior:'smooth' });
}
function openApply(){
  if (view === 'apply') return window.scrollTo({ top:0, behavior:'smooth' });
  picked = new Set([current]);
  renderApply();
  history.pushState({ apply: true }, '', '#apply/' + current);
  setView('apply');
  window.scrollTo({ top:0, behavior:'instant' });
}
function backToGuide(){
  if (history.state?.apply) return history.back();      // 가이드에서 넘어온 경우: 진짜 뒤로가기
  history.replaceState({}, '', '#' + current);           // 지원서 주소로 바로 들어온 경우
  setView('main');
  $('guide').scrollIntoView({ behavior:'instant' });
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [a, b] = h.split('/');
  const id = a === 'apply' ? b : a;
  if (BRANDS.some((x) => x.id === id)) current = id;
  picked = new Set([current]);
  renderGuide(); renderApply();
  if (a === 'apply') { setView('apply'); window.scrollTo({ top:0, behavior:'instant' }); }
  else {
    const wasApply = view === 'apply';
    setView('main');
    if (wasApply) $('guide').scrollIntoView({ behavior:'instant' });
  }
}
window.addEventListener('popstate', route);

/* main 화면에서 가이드가 화면 가운데를 넘어오면 상단 메뉴를 Guide 로 */
function syncSection(){
  if (view !== 'main') return;
  const next = $('guide').getBoundingClientRect().top < innerHeight * 0.5 ? 'guide' : 'top';
  if (next !== section) { section = next; renderNav(); }
}
let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { ticking = false; syncSection(); });
}, { passive: true });

/* ── 이벤트 ── */
document.addEventListener('click', async (e) => {
  const t = e.target;
  const brandBtn = t.closest('[data-brand]');
  if (brandBtn) { closeSheet(); selectBrand(brandBtn.dataset.brand); return; }
  if (t.closest('[data-back]')) { backToGuide(); return; }
  const go = t.closest('[data-go]');
  if (go) {
    const id = go.dataset.go;
    if (id === 'apply') return openApply();
    if (view === 'apply') {                       // 지원서 화면에서 Home/Guide → 가이드 화면으로
      if (history.state?.apply) history.back(); else { history.replaceState({}, '', '#' + current); setView('main'); }
      setTimeout(() => { (id === 'top' ? window.scrollTo({ top:0, behavior:'instant' }) : $(id).scrollIntoView({ behavior:'instant' })); syncSection(); }, 60);
      return;
    }
    id === 'top' ? window.scrollTo({ top:0, behavior:'smooth' }) : $(id).scrollIntoView({ behavior:'smooth' });
    return;
  }
  const pick = t.closest('[data-pick]');
  if (pick) { const id = pick.dataset.pick; picked.has(id) ? picked.delete(id) : picked.add(id); renderBrandChips(); return; }
  const copy = t.closest('[data-copy]');
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); } catch {
      const ta = document.createElement('textarea'); ta.value = copy.dataset.copy; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove();
    }
    copy.classList.add('done'); setTimeout(() => copy.classList.remove('done'), 1200);
    toast('복사되었어요');
  }
});
$('fab').onclick = () => ($('sheet').classList.contains('open') ? closeSheet() : openSheet());
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
/* 시트를 아래로 끌어서 닫기 */
(() => {
  let y0 = null; const s = $('sheet');
  s.addEventListener('touchstart', (e) => { if ($('sheetList').scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive:true });
  s.addEventListener('touchend', (e) => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 60) closeSheet(); y0 = null; });
})();
/* 화살표 안내 말풍선은 처음 조금 보여주고 숨김 */
setTimeout(() => $('fabTip').classList.add('hide'), 4000);

loadData().then(() => {
  if (!BRANDS.length) {
    $('guide').innerHTML = `<p class="eyebrow">CONTENTS GUIDE</p><h2 class="g-title">준비 중이에요</h2><p class="g-desc">지금 모집 중인 캠페인이 없어요. 곧 새로운 캠페인으로 찾아올게요.</p>`;
    $('fab').hidden = true; $('fabTip').hidden = true;
    renderNav();
    return;
  }
  current = BRANDS[0].id;
  route();
}).catch(() => {
  $('guide').innerHTML = `<h2 class="g-title">불러오지 못했어요</h2><p class="g-desc">잠시 후 새로고침 해주세요.</p>`;
  renderNav();
});
</script>
</body>
