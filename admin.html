<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Siriai Admin</title>
<link rel="icon" href="assets/symbol-black.png">
<link rel="stylesheet" href="internal.css">
<style>
/* GitHub 연결 */
.gh-state{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; background:var(--card); font-size:13px; }
.gh-state .dot{ width:9px; height:9px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
.gh-state.ok .dot{ background:var(--ok); }
.gh-state b{ font-weight:700; }
.gh-state .pill{ margin-left:auto; }
.steps{ font-size:13px; line-height:1.75; color:var(--muted); padding-left:18px; margin:14px 0; }
.steps b{ color:var(--ink); }
.steps a{ color:var(--accent); font-weight:700; }
.row{ display:flex; gap:8px; }
.row .input{ flex:1; }

/* 입력 */
.input{ width:100%; padding:12px 13px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:14.5px; color:var(--ink); outline:none; transition:border-color .15s, background .15s; }
.input:focus{ border-color:var(--accent); background:#fff; }
.input.bad{ border-color:var(--accent); }
textarea.input{ resize:vertical; min-height:88px; line-height:1.55; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; min-width:0; }
.field label{ font-size:12.5px; font-weight:700; }
.field label i{ color:var(--accent); font-style:normal; margin-left:2px; }
.field small{ font-size:11.5px; color:var(--muted); line-height:1.5; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 10px; }
@media (max-width:520px){ .grid3{ grid-template-columns:1fr 1fr; } }
.check{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; cursor:pointer; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
.check input{ accent-color:var(--accent); width:17px; height:17px; margin:0; }
.checks{ display:flex; flex-wrap:wrap; gap:8px; }
.sec{ font-size:11px; font-weight:800; color:var(--accent); letter-spacing:.06em; margin:22px 0 12px; padding-top:18px; border-top:1px solid var(--line); }
.sec:first-of-type{ border-top:none; padding-top:0; margin-top:4px; }

/* 브랜드 목록 */
.list{ display:flex; flex-direction:column; gap:8px; }
.item{ display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:14px; }
.mono{ width:42px; height:42px; flex:0 0 auto; border-radius:12px; display:grid; place-items:center; font-weight:900; font-size:14px; color:#fff; }
.item .txt{ flex:1; min-width:0; }
.item .txt b{ display:block; font-size:15px; }
.item .txt span{ display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
.meta em{ font-style:normal; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--card); color:var(--muted); }
.meta em.hot{ background:var(--accent-soft); color:var(--accent); }
.item .ops{ display:flex; gap:4px; flex:0 0 auto; }
.icon{ width:34px; height:34px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
.icon:disabled{ opacity:.35; cursor:default; }
.icon svg{ width:16px; height:16px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.icon.danger{ color:var(--accent); }
@media (max-width:520px){
  .item{ flex-wrap:wrap; }
  .item .txt span{ white-space:normal; }
  .item .ops{ width:100%; justify-content:flex-end; padding-top:10px; border-top:1px solid var(--line); }
}
.meta em.closed{ background:#ebeae7; color:var(--muted); text-decoration:line-through; }
.meta em.hidden{ background:var(--ink); color:#fff; }
.item.dim{ opacity:.6; }
.order-bar{ position:sticky; bottom:12px; z-index:6; margin-top:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px; border-radius:14px; background:var(--ink); color:#fff; box-shadow:0 14px 30px -14px rgba(0,0,0,.5); }
.order-bar[hidden]{ display:none; }
.tier-rows{ display:flex; flex-direction:column; gap:8px; }
.tier-row{ display:grid; grid-template-columns:130px 1fr auto; gap:8px; align-items:center; }
.tier-row .tier-name{ font-size:13px; }
.tier-row .input:disabled{ opacity:.45; }
.tier-row .nofee{ white-space:nowrap; }
@media (max-width:520px){ .tier-row{ grid-template-columns:1fr auto; } .tier-row .tier-name{ grid-column:1/-1; } }
.order-bar span{ flex:1 1 180px; font-size:13px; font-weight:600; }
.order-bar .btn:not(.primary){ background:transparent; color:#fff; border-color:rgba(255,255,255,.35); }
.meta em.fee{ background:#171310; color:#fff; }
.grip{ flex:0 0 auto; align-self:stretch; width:22px; margin:-12px -6px -12px -8px; display:grid; place-items:center; color:#b9b2a3; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
.grip svg{ width:16px; height:16px; fill:currentColor; }
.grip:hover{ color:var(--ink); }
.item.dragging{ position:relative; z-index:5; background:#fff; opacity:1; box-shadow:0 14px 30px -14px rgba(0,0,0,.4); border-color:var(--ink); }
.list.sorting, .list.sorting *{ cursor:grabbing !important; user-select:none; }
.gh-state.warn .dot{ background:var(--accent); }
.ig-in{ font-size:12.5px; padding:9px 11px; }
/* 링크 팝업 */
.links{ display:flex; flex-direction:column; gap:8px; }
.link-row{ display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:12px; }
.link-row b{ font-size:14px; flex:0 0 auto; }
.link-row span{ flex:1; min-width:0; font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.link-row .btn{ flex:0 0 auto; padding:8px 12px; font-size:12px; }
.empty{ text-align:center; padding:28px 10px; color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:14px; }
.head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; }
.head .btn{ flex:0 0 auto; }

/* 릴스 슬롯 */
.reels{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.slot{ display:flex; flex-direction:column; gap:8px; }
.slot .pv{ position:relative; aspect-ratio:9/16; border-radius:6px; overflow:hidden; background:var(--card); border:1px dashed var(--line); display:grid; place-items:center; color:var(--muted); font-size:11px; text-align:center; padding:8px; }
.slot .pv.has{ border-style:solid; padding:0; }
.slot .pv video,.slot .pv img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.slot .pv .badge{ position:absolute; top:8px; left:8px; z-index:2; font-size:10px; font-weight:700; color:#fff; background:rgba(23,19,16,.65); padding:3px 8px; border-radius:999px; }
.slot .pv .new{ position:absolute; bottom:8px; left:8px; z-index:2; font-size:10px; font-weight:800; color:#fff; background:var(--accent); padding:3px 8px; border-radius:999px; }
.slot .actions .btn{ padding:9px 8px; font-size:12px; }

/* 편집 시트 */
.overlay{ position:fixed; inset:0; z-index:50; background:rgba(23,19,16,.32); display:flex; justify-content:center; align-items:flex-end; }
.editor{ width:100%; max-width:680px; max-height:94svh; overflow-y:auto; background:var(--bg); border-radius:20px 20px 0 0; padding:20px 20px 0; animation:up .32s cubic-bezier(.16,1,.3,1); }
@keyframes up{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
.editor-foot{ position:sticky; bottom:0; z-index:5; background:linear-gradient(transparent, #fff 30%); padding:20px 0 calc(16px + env(safe-area-inset-bottom)); display:flex; gap:8px; }
.editor h2{ display:flex; align-items:center; gap:10px; }
.close{ margin-left:auto; }
.busy{ position:fixed; inset:0; z-index:90; background:rgba(255,255,255,.7); display:grid; place-items:center; font-size:14px; font-weight:700; }
.busy > div{ background:#fff; border:1px solid var(--line); padding:16px 22px; border-radius:14px; box-shadow:0 12px 30px -12px rgba(0,0,0,.2); }
.note{ font-size:12px; color:var(--muted); line-height:1.6; margin:10px 0 0; }
</style>
</head>
<body>

    <h1>Siriai Admin</h1>

    <div class="pin">
      <input inputmode="numeric" maxlength="1" aria-label="비밀번호 1번째">

      <input inputmode="numeric" maxlength="1" aria-label="비밀번호 3번째">

<div class="shell" id="app" hidden>
  <header class="topbar">

  </header>

  <!-- GitHub 연결 -->

  <!-- 진행 중인 캠페인 -->

      <div><p class="eyebrow">CAMPAIGNS</p><h2>진행 중인 캠페인</h2></div>

    <div class="list" id="list"></div>

    <textarea class="input" id="past" rows="8"></textarea>

<div id="editorRoot"></div>
<div class="busy" id="busy" hidden><div id="busyMsg">저장 중…</div></div>
<div class="toast" id="toast"></div>

<script src="vault.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   어드민: brands.json 과 reels/ 폴더를 GitHub API 로 직접 수정해요.
   저장 = 레포에 커밋 → GitHub Pages 가 1분쯤 뒤 사이트에 반영.
   GitHub 토큰은 이 기기 브라우저에만 저장돼요. (레포에 올라가지 않음)
   ════════════════════════════════════════════════════════════ */
const REPO = { owner: 'hwangyksiriai', name: 'SIRIAI-Guideline', branch: 'main' };
const API = `https://api.github.com/repos/${REPO.owner}/${REPO.name}`;
const TOKEN_KEY = 'siriai-gh-token';
const MAX_MB = 40;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const ICON = {
  up: '<path d="M6 15l6-6 6 6"/>', down: '<path d="M6 9l6 6 6-6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  link: '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>',
  dup: '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;

let TIERS = [];          // [{code,label,fee}] — 비밀번호로 복호화
let TIER_HASH = {};      // code → hash
let DATA = { pastBrands: [], brands: [] };
let SHA = null;          // brands.json 의 현재 sha (GitHub)
let token = '';
let ghUser = '';

function toast(msg, err){
  const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), err ? 4200 : 2400);
}
function busy(msg){ $('busyMsg').textContent = msg; $('busy').hidden = false; }
function idle(){ $('busy').hidden = true; }

/* ── base64 (UTF-8 안전) ── */
function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToUtf8(b64){
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function fileToB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

/* ── GitHub API ── */
async function gh(path, opts = {}){
  const res = await fetch(API + path, {
    cache: 'no-store',   // GitHub API 응답은 브라우저에 60초 캐시돼서, 연달아 저장하면 옛 버전을 읽고 충돌로 실패했었음
    ...opts,
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) },
  });
  if (!res.ok) {
    let msg = res.status + '';
    try { msg += ' ' + (await res.json()).message; } catch {}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return res.status === 204 ? null : res.json();
}
const CONFLICT = 'conflict';
const conflict = () => Object.assign(new Error(CONFLICT), { status: CONFLICT });

/* ── 데이터 읽기 ── */
async function readBrandsAt(ref){
  const f = await gh(`/contents/brands.json?ref=${ref}`);
  const d = JSON.parse(b64ToUtf8(f.content));
  d.pastBrands ||= []; d.brands ||= [];
  return d;
}
async function loadData(){
  if (token) DATA = await readBrandsAt(REPO.branch);
  else {
    DATA = await (await fetch('brands.json?t=' + Date.now(), { cache:'no-store' })).json();
    DATA.pastBrands ||= []; DATA.brands ||= [];
  }
}

/* ── 저장: 파일 업로드 + brands.json 변경을 커밋 하나로 ──
   여러 커밋이 몇 초 간격으로 들어가면 GitHub Pages 배포가 겹쳐 실패할 수 있어서
   Git Data API(blob → tree → commit → ref)로 한 번에 올려요.
   mutate(latest) 는 '지금 GitHub에 있는 최신본'에 변경을 적용해요. 그 사이 다른 곳에서
   같은 브랜드가 바뀌었으면 mutate 가 conflict() 를 던져서 덮어쓰지 않아요. */
async function commitChange({ mutate, files = [], deletes = [], message }){
  const blobs = [];
  for (const f of files) {
    busy(f.label || '파일 올리는 중…');
    const b = await gh('/git/blobs', { method:'POST', body: JSON.stringify({ content: f.b64, encoding:'base64' }) });
    blobs.push({ path: f.path, sha: b.sha });
  }
  busy('저장 중…');
  for (let attempt = 0; attempt < 5; attempt++) {
    if (attempt) await new Promise((r) => setTimeout(r, 400 * attempt));
    const ref = await gh(`/git/ref/heads/${REPO.branch}`);
    const head = ref.object.sha;
    const commit = await gh(`/git/commits/${head}`);
    const latest = await readBrandsAt(head);
    mutate(latest);
    const json = await gh('/git/blobs', { method:'POST', body: JSON.stringify({ content: utf8ToB64(JSON.stringify(latest, null, 2) + '\n'), encoding:'base64' }) });
    const tree = [
      ...blobs.map((b) => ({ path: b.path, mode:'100644', type:'blob', sha: b.sha })),
      { path:'brands.json', mode:'100644', type:'blob', sha: json.sha },
    ];
    for (const p of (typeof deletes === 'function' ? deletes(latest) : deletes)) {
      try { await gh(`/contents/${p.split('/').map(encodeURIComponent).join('/')}?ref=${head}`); tree.push({ path: p, mode:'100644', type:'blob', sha: null }); }
      catch (e) { if (e.status !== 404) throw e; }
    }
    const t = await gh('/git/trees', { method:'POST', body: JSON.stringify({ base_tree: commit.tree.sha, tree }) });
    const c = await gh('/git/commits', { method:'POST', body: JSON.stringify({ message, tree: t.sha, parents: [head] }) });
    try {
      await gh(`/git/refs/heads/${REPO.branch}`, { method:'PATCH', body: JSON.stringify({ sha: c.sha, force: false }) });
      DATA = latest;
      return;
    } catch (e) {
      if (e.status !== 422) throw e;   // 그 사이 다른 커밋이 들어옴 → 최신본으로 다시
    }
  }
  throw conflict();
}

/* 편집 시작 시점의 브랜드와 지금 GitHub의 브랜드가 같은지 */
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
/* 다른 브랜드(복제본 등)가 아직 쓰는 파일은 지우지 않기 */
const unused = (paths, d) => { const used = new Set(d.brands.flatMap((x) => x.reels || [])); return paths.filter((p) => p?.startsWith('reels/') && !used.has(p)); };

/* ── GitHub 연결 카드 ── */
function renderGh(){
  const card = $('ghCard');
  if (token) {
    card.innerHTML = `<p class="eyebrow">GITHUB</p><h2>저장 연결</h2>
      <div class="gh-state ok"><span class="dot"></span><span><b>${esc(ghUser || '연결됨')}</b> 계정으로 저장해요</span>
      <button class="pill" id="ghOut">연결 해제</button></div>
      <p class="note">저장하면 레포에 커밋되고, 1분쯤 뒤 사이트에 반영돼요. 토큰은 이 기기 브라우저에만 저장돼요.</p>`;
    $('ghOut').onclick = () => { if (!confirm('이 기기에서 GitHub 연결을 해제할까요?')) return; try { localStorage.removeItem(TOKEN_KEY); } catch {} token = ''; ghUser = ''; renderGh(); renderList(); };
    return;
  }
  card.innerHTML = `<p class="eyebrow">GITHUB</p><h2>저장 연결이 필요해요</h2>
    <p class="desc">수정한 내용을 사이트에 반영하려면 이 기기에서 한 번만 GitHub를 연결해주세요.</p>
    <ol class="steps">
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">GitHub 토큰 만들기</a>를 열어요. (GitHub 로그인 필요)</li>
      <li><b>Repository access</b> → Only select repositories → <b>${REPO.name}</b> 선택</li>
      <li><b>Permissions</b> → Repository permissions → <b>Contents</b> 를 <b>Read and write</b> 로</li>
      <li>맨 아래 <b>Generate token</b> → 나온 토큰을 복사해서 아래에 붙여넣어요.</li>
    </ol>
    <div class="row"><input class="input" id="tokenIn" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"><button class="btn primary" id="ghIn" style="flex:0 0 auto">연결</button></div>
    <p class="note">토큰은 이 기기 브라우저에만 저장되고 레포에는 올라가지 않아요. 회사 기기에서만 연결해주세요.</p>`;
  $('ghIn').onclick = connect;
  $('tokenIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
}
async function connect(){
  const t = $('tokenIn').value.trim();
  if (!t) return $('tokenIn').classList.add('bad');
  token = t;
  busy('연결 확인 중…');
  try {
    const repo = await gh('');
    if (!repo.permissions?.push) throw Object.assign(new Error('쓰기 권한이 없어요. Contents 권한을 Read and write 로 만들어주세요.'), { status: 403 });
    try { ghUser = (await fetch('https://api.github.com/user', { headers: { Authorization: `Bearer ${token}` } }).then((r) => r.json())).login || ''; } catch {}
    try { localStorage.setItem(TOKEN_KEY, token); localStorage.setItem(TOKEN_KEY + '-user', ghUser); } catch {}
    await loadData();
    renderGh(); renderSheetCard(); renderList(); renderPast();
    toast('GitHub에 연결했어요');
  } catch (e) {
    token = '';
    toast(e.status === 401 ? '토큰이 맞지 않아요. 다시 확인해주세요.' : e.status === 404 ? '이 레포에 접근할 수 없어요. 레포 선택을 확인해주세요.' : (e.message || '연결하지 못했어요'), true);
  } finally { idle(); }
}

const NO_FEE = '고료 없음';
const feeLabel = (f) => Number(f) % 10000 === 0 ? Number(f) / 10000 + '만원' : Number(f).toLocaleString() + '원';
/* 목록 카드에 링크별 고료 요약 (예: 고료 5만원 · 10만원 · 제품만) */
async function fillFees(L){
  await null;   // 목록이 그려진 뒤에 채우기
  for (const b of L) {
    if (!b.tierFees) continue;
    const vals = [];
    for (const t of TIERS) { const s = b.tierFees[TIER_HASH[t.code]]; if (s) vals.push(await SiriaiVault.openForCode(t.code, s.v)); }
    const el = document.querySelector(`[data-fee="${CSS.escape(b.id)}"]`);
    if (el && vals.some(Boolean)) { el.textContent = '고료 ' + vals.filter(Boolean).join(' · '); el.hidden = false; }
  }
}

function slug(s){ return String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 26); }
/* 겹치지 않는 ID: 'tocobo' 가 있으면 'tocobo-2', 한글만 있는 이름이면 'brand-xxxx' */
function uniqueId(name){
  let base = slug(name);
  if (base.length < 2) base = 'brand-' + Math.random().toString(36).slice(2, 6);
  const taken = new Set(DATA.brands.map((b) => b.id));
  if (!taken.has(base)) return base;
  for (let i = 2; ; i++) if (!taken.has(`${base}-${i}`)) return `${base}-${i}`;
}

      <div class="field"><label>마감 강조</label><label class="check"><input type="checkbox" name="hot" ${b.hot ? 'checked' : ''}>마감일을 빨갛게 표시</label></div>
    </div>

    <p class="sec">레퍼런스 릴스</p>
    <div class="reels" id="reelSlots"></div>
    <p class="note">인스타그램 릴스 링크를 붙여넣는 게 가장 빨라요. 파일은 세로 영상(mp4)·이미지, 한 개당 ${MAX_MB}MB 이하.</p>

    <p class="sec">이렇게 제작해 주세요</p>
    <div class="field"><label>필수사항</label><textarea class="input" name="make" placeholder="한 줄에 하나씩&#10;비우면 ‘별도 가이드로 전달 예정입니다.’">${esc((b.make || []).join('\n'))}</textarea></div>

    <p class="sec">이렇게 업로드해 주세요</p>
    <div class="field"><label>태그할 계정<i>*</i></label><input class="input" name="account" value="${esc(b.account)}" placeholder="@brand_official" autocapitalize="off"></div>
    <div class="field"><label>필수 해시태그<i>*</i></label><input class="input" name="hashtags" value="${esc(b.hashtags)}" placeholder="#광고 #브랜드 #제품명"></div>
    <div class="field"><label>해시태그 안내</label><input class="input" name="hashNote" value="${esc(b.hashNote)}" placeholder="광고 표기를 멘션 맨 앞에 배치"></div>
    <div class="field"><label>필수사항</label><textarea class="input" name="upload" placeholder="한 줄에 하나씩&#10;비우면 ‘별도 가이드로 전달 예정입니다.’">${esc((b.upload || []).join('\n'))}</textarea></div>

    <p class="sec">필수 조건</p>
    <div class="checks">
      <label class="check"><input type="checkbox" name="collab" ${b.collab !== false ? 'checked' : ''}>공동 작업자 초대 필수</label>
      <label class="check"><input type="checkbox" name="secondaryUse" ${b.secondaryUse !== false ? 'checked' : ''}>2차 활용 동의 필수</label>
    </div>
    <p class="note">켜두면 가이드에 ‘필수’ 표시만 짧게 나가요. 자세한 내용은 실제 가이드라인으로 안내해주세요. 지원서에서 동의해야 지원할 수 있고, 동의 여부는 시트에 기록돼요.</p>

    <p class="sec">링크별 고료</p>
    <div class="tier-rows">${tierChecks}</div>
    <p class="note">이 캠페인은 모든 링크에서 보여요. 링크마다 고료만 따로 적어요. 고료는 <b>그 링크로 들어온 인플루언서에게만</b> 보이고, 지원서 시트의 ‘캠페인 고료’ 칸에도 들어가요. 고료가 없으면 <b>고료 X</b>를 체크하세요 (가이드에 ‘고료 없음’으로 보여요).</p>

    <div class="editor-foot">
      <button type="submit" class="btn primary" style="flex:1">저장</button>
    </div>
  </form></div>`;
  renderSlots();
  const f = $('ed');
  if (editing.isNew) f.name.addEventListener('input', () => { if (!f.id.dataset.touched) f.id.value = f.name.value.trim() ? uniqueId(f.name.value) : ''; });
  f.id.addEventListener('input', () => { f.id.dataset.touched = '1'; });
  f.addEventListener('input', (e) => e.target.classList?.remove('bad'));
  f.querySelectorAll('[data-nofee]').forEach((cb) => cb.addEventListener('change', () => {
    const inp = f[`fee-${cb.dataset.nofee}`]; inp.disabled = cb.checked;
    if (cb.checked) { inp.value = ''; inp.placeholder = NO_FEE; }
    if (!cb.checked && !inp.value) inp.value = feeLabel(TIERS.find((t) => t.code === cb.dataset.nofee).fee);
  }));
  f.addEventListener('submit', (e) => { e.preventDefault(); saveBrand(); });
  $('edClose').onclick = closeEditor;   // 닫기는 X 버튼으로만 (바깥 클릭·ESC로는 안 닫혀요)
  document.body.style.overflow = 'hidden';
}
function closeEditor(){
  editing?.reels.forEach((r) => r.url && URL.revokeObjectURL(r.url));
  editing = null; $('editorRoot').innerHTML = ''; document.body.style.overflow = '';
}
function renderSlots(){
  $('reelSlots').innerHTML = editing.reels.map((r, i) => {
    const src = r.file ? r.url : (!r.removed && r.path ? r.path : '');
    const isVid = r.file ? r.file.type.startsWith('video') : /\.(mp4|mov|webm)$/i.test(src);
    const media = r.link ? `<span style="position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(160deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)">인스타그램 링크</span>`
      : src ? (isVid ? `<video src="${esc(src)}" muted loop autoplay playsinline></video>` : `<img src="${esc(src)}" alt="">`) : '';
    const filled = !!(r.link || src);
    return `<div class="slot">
      <div class="pv ${filled ? 'has' : ''}"><span class="badge">REF ${i + 1}</span>${media || '비어 있어요'}${r.file ? '<span class="new">새 파일</span>' : ''}</div>
      <input class="input ig-in" data-link="${i}" placeholder="인스타그램 릴스 링크" value="${esc(r.link)}" spellcheck="false" autocapitalize="off">
      <div class="actions">
        <label class="btn">${src && !r.link ? '파일 바꾸기' : '파일 선택'}<input type="file" accept="video/mp4,video/quicktime,video/webm,image/*" data-slot="${i}" hidden></label>
        ${filled ? `<button type="button" class="btn danger" data-unslot="${i}">비우기</button>` : ''}
      </div></div>`;
  }).join('');
  $('reelSlots').querySelectorAll('input[type=file]').forEach((inp) => inp.addEventListener('change', () => {
    const file = inp.files[0]; if (!file) return;
    if (file.size > MAX_MB * 1024 * 1024) return toast(`${MAX_MB}MB 이하 파일만 올릴 수 있어요 (지금 ${(file.size / 1048576).toFixed(1)}MB). 인스타그램 링크를 붙여넣어 보세요.`, true);
    const r = editing.reels[+inp.dataset.slot];
    if (r.url) URL.revokeObjectURL(r.url);
    r.file = file; r.url = URL.createObjectURL(file); r.removed = false; r.link = '';
    renderSlots();
  }));
  $('reelSlots').querySelectorAll('[data-link]').forEach((inp) => inp.addEventListener('change', () => {
    const r = editing.reels[+inp.dataset.link];
    const v = inp.value.trim();
    if (v && !/^https:\/\/(www\.)?instagram\.com\/(reel|reels|p|tv)\/[\w-]+/i.test(v)) { inp.classList.add('bad'); return toast('instagram.com/reel/… 형태의 링크를 붙여넣어주세요', true); }
    if (r.url) URL.revokeObjectURL(r.url);
    r.link = v.split('?')[0]; r.file = null; r.url = '';
    if (v) r.removed = true;          // 올려둔 파일이 있었다면 링크로 대체
    renderSlots();
  }));
  $('reelSlots').querySelectorAll('[data-unslot]').forEach((btn) => btn.addEventListener('click', () => {
    const r = editing.reels[+btn.dataset.unslot];
    if (r.url) URL.revokeObjectURL(r.url);
    r.file = null; r.url = ''; r.removed = true; r.link = '';
    renderSlots();
  }));
}

const lines = (s) => String(s || '').split('\n').map((x) => x.trim()).filter(Boolean);

async function saveBrand(){
  if (needToken()) return;
  const f = $('ed');
  const v = (n) => f[n].value.trim();
  const b = {
    id: v('id'), name: v('name'), summary: v('summary'),
    account: v('account'), hashtags: v('hashtags'), hashNote: v('hashNote'),
    reward: v('reward') || '제품', deadline: v('deadline'), announce: v('announce'), uploadDate: v('uploadDate'),
    status: f.querySelector('input[name=status]:checked')?.value || 'open',
    collab: f.collab.checked, secondaryUse: f.secondaryUse.checked,
    hot: f.hot.checked, color: f.color.value, category: '뷰티',
    make: lines(f.make.value), upload: lines(f.upload.value),
    reels: ['', ''], tierHashes: [],
  };
  /* 검사 */
  const bad = [];
  ['name', 'summary', 'account'].forEach((n) => { if (!b[n]) bad.push(n); });
  if (!b.hashtags || b.hashtags === '#광고') bad.push('hashtags');
  if (!/^[a-z0-9][a-z0-9-]{1,29}$/.test(b.id)) bad.push('id');
  if (editing.isNew && DATA.brands.some((x) => x.id === b.id)) { bad.push('id'); toast('같은 ID의 브랜드가 이미 있어요', true); }
  if (bad.length) { bad.forEach((n) => f[n].classList.add('bad')); f[bad[0]].focus(); if (!editing.isNew || !DATA.brands.some((x) => x.id === b.id)) toast('표시된 칸을 확인해주세요', true); return; }
  b.tierHashes = [];   // 모든 링크에서 보여요 (링크마다 고료만 다름)

  busy('저장 중…');
  try {
    /* 링크별 고료: v = 그 링크 코드로만 풀리는 값(가이드용), s = 시트만 풀 수 있는 값 */
    b.tierFees = {};
    for (const t of TIERS) {
      const fee = f.querySelector(`[data-nofee="${t.code}"]`).checked ? NO_FEE : f[`fee-${t.code}`].value.trim();
      if (fee) b.tierFees[TIER_HASH[t.code]] = { v: await SiriaiVault.sealForCode(t.code, fee), s: await SiriaiVault.seal(fee) };
    }
    /* 릴스: 새 파일은 같은 커밋에 넣고, 바뀌거나 비운 옛 파일은 같은 커밋에서 지움 */
    const files = [], deletes = [];
    for (let i = 0; i < 2; i++) {
      const r = editing.reels[i];
      if (r.file) {
        const ext = (r.file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
        const path = `reels/${b.id}-${i + 1}-${Date.now().toString(36)}.${ext}`;
        files.push({ path, b64: await fileToB64(r.file), label: `릴스 ${i + 1} 올리는 중… (${(r.file.size / 1048576).toFixed(1)}MB)` });
        b.reels[i] = path;
        if (r.path?.startsWith('reels/')) deletes.push(r.path);
      } else if (r.link) {
        b.reels[i] = r.link;
        if (r.path?.startsWith('reels/')) deletes.push(r.path);
      } else if (r.removed) {
        if (r.path?.startsWith('reels/')) deletes.push(r.path);
      } else b.reels[i] = r.path || '';
    }
    const isNew = editing.isNew, origId = editing.origId;
    await commitChange({
      files, deletes: (d) => unused(deletes, d),
      message: `admin: ${b.name} ${isNew ? '추가' : '수정'}`,
      mutate: (d) => {
        /* 지금 편집한 브랜드만 바꾸고, 다른 브랜드·순서는 GitHub 최신본 그대로 둬요 */
        const idx = d.brands.findIndex((x) => x.id === (isNew ? b.id : origId));
        if (isNew && idx >= 0) throw Object.assign(new Error('dup-id'), { status: 'dup-id' });
        if (idx >= 0) d.brands[idx] = b; else d.brands.push(b);
      },
    });
    closeEditor(); renderList();
    toast('저장했어요. 1분쯤 뒤 사이트에 반영돼요');
  } catch (e) {
    /* 실패해도 편집 창은 그대로 — 고친 내용이 날아가지 않게 */
    toast(e.status === 'dup-id' ? '같은 ID의 브랜드가 방금 생겼어요. ID를 바꿔서 다시 저장해주세요.' : errMsg(e), true);
  }
  finally { idle(); }
}

async function deleteBrand(id){
  if (needToken()) return;
  const b = DATA.brands.find((x) => x.id === id); if (!b) return;
  if (!confirm(`${b.name} 브랜드를 삭제할까요?\n가이드 페이지와 브랜드 목록에서 사라져요.`)) return;
  busy('삭제 중…');
  try {
    let gone = [];
    await commitChange({
      message: `admin: ${b.name} 삭제`,
      mutate: (d) => {
        const cur = d.brands.find((x) => x.id === id);
        if (!cur) return;
        gone = (cur.reels || []).filter((p) => p?.startsWith('reels/'));
        d.brands = d.brands.filter((x) => x.id !== id);
      },
      deletes: (d) => unused(gone, d),
    });
    renderList(); toast('삭제했어요. 1분쯤 뒤 사이트에 반영돼요');
  } catch (e) { toast(errMsg(e), true); try { await loadData(); renderList(); } catch {} }
  finally { idle(); }
}

/* ── 드래그로 순서 바꾸기 (왼쪽 점 손잡이, 마우스·터치 모두) ── */
let drag = null;
const listIds = () => [...$('list').querySelectorAll('.item')].map((x) => x.dataset.id);
$('list').addEventListener('pointerdown', (e) => {
  const grip = e.target.closest('.grip'); if (!grip || e.button > 0) return;
  e.preventDefault();
  const item = grip.closest('.item');
  grip.setPointerCapture(e.pointerId);
  drag = { item, y: e.pageY, before: listIds().join('|') };
  item.classList.add('dragging'); $('list').classList.add('sorting');
});
$('list').addEventListener('pointermove', (e) => {
  if (!drag) return;
  const { item } = drag, list = $('list');
  if (e.clientY < 70) scrollBy(0, -12); else if (e.clientY > innerHeight - 70) scrollBy(0, 12);
  const prev = item.previousElementSibling, next = item.nextElementSibling;
  const mid = (el) => el.getBoundingClientRect().top + scrollY + el.offsetHeight / 2;
  const top0 = item.offsetTop;
  if (next && e.pageY > mid(next)) list.insertBefore(next, item);
  else if (prev && e.pageY < mid(prev)) list.insertBefore(item, prev);
  drag.y += item.offsetTop - top0;                       // 자리를 옮긴 만큼 기준점도 이동
  item.style.transform = `translateY(${e.pageY - drag.y}px)`;
});
function endDrag(){
  if (!drag) return;
  const { item, before } = drag; drag = null;
  item.style.transform = ''; item.classList.remove('dragging'); $('list').classList.remove('sorting');
  const order = listIds();
  if (order.join('|') !== before) setPendingOrder(order);   // 저장은 '순서 저장' 버튼으로 한 번에
}
$('list').addEventListener('pointerup', endDrag);
$('list').addEventListener('pointercancel', endDrag);

async function saveOrder(){
  if (!pendingOrder || needToken()) return;
  const order = pendingOrder;
  busy('순서 저장 중…');
  try {
    await commitChange({
      message: 'admin: 캠페인 순서 변경',
      mutate: (d) => {
        const rank = (b) => { const k = order.indexOf(b.id); return k < 0 ? order.length : k; };   // 그사이 새로 생긴 건 맨 뒤
        d.brands.sort((a, b) => rank(a) - rank(b));
      },
    });
    pendingOrder = null; renderList(); toast('순서를 저장했어요. 1분쯤 뒤 사이트에 반영돼요');
  } catch (e) { toast(errMsg(e), true); }
  finally { idle(); }
}

function moveBrand(i, dir){
  const ids = orderedBrands().map((b) => b.id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  setPendingOrder(ids);
}
$('orderSave').onclick = saveOrder;
$('orderUndo').onclick = () => { pendingOrder = null; renderList(); };
addEventListener('beforeunload', (e) => { if (pendingOrder) { e.preventDefault(); e.returnValue = ''; } });

async function savePast(){
  if (needToken()) return;
  const list = lines($('past').value);
  busy('저장 중…');
  try {
    await commitChange({
      message: 'admin: 흐르는 글씨(진행 브랜드) 수정',
      mutate: (d) => { d.pastBrands = list; },
    });
    renderPast(); toast('저장했어요. 1분쯤 뒤 사이트에 반영돼요');
  } catch (e) { toast(errMsg(e), true); }
  finally { idle(); }
}

function errMsg(e){
  if (e.status === CONFLICT) return '저장이 몰려서 실패했어요. 잠시 후 저장을 한 번 더 눌러주세요. (고친 내용은 그대로 있어요)';
  if (e.status === 401) return '토큰이 만료됐거나 맞지 않아요. 연결을 해제하고 다시 연결해주세요.';
  if (e.status === 403) return '저장 권한이 없어요. 토큰의 Contents 권한을 확인해주세요.';
  if (e.status === 409 || e.status === 422) return '다른 곳에서 동시에 수정됐어요. 새로고침 후 다시 시도해주세요.';
  return '저장하지 못했어요 (' + (e.message || '알 수 없는 오류') + ')';
}

/* ── 이벤트 ── */
document.addEventListener('click', (e) => {
  const m = e.target.closest('[data-move]'); if (m) { const [i, d] = m.dataset.move.split(':').map(Number); return moveBrand(i, d); }
  const ed = e.target.closest('[data-edit]'); if (ed) return openEditor(ed.dataset.edit);
  const del = e.target.closest('[data-del]'); if (del) return deleteBrand(del.dataset.del);
  const dup = e.target.closest('[data-dup]'); if (dup) return openEditor(dup.dataset.dup, true);
  const lk = e.target.closest('[data-links]'); if (lk) return openLinks(lk.dataset.links);
  const cp = e.target.closest('[data-copylink]');
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copylink).then(() => toast('링크를 복사했어요'), () => toast('복사하지 못했어요. 길게 눌러 복사해주세요', true)); return; }
});
$('addBtn').onclick = () => openEditor(null);
$('savePast').onclick = savePast;
$('logout').onclick = SiriaiVault.lock;
/* 다른 탭에서 돌아오면 최신 내용으로 (편집 중이 아닐 때만) */
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || editing || $('app').hidden) return;
  try { await loadData(); renderSheetCard(); renderList(); renderPast(); } catch {}
});

SiriaiVault.mountLock({
  lockEl: $('lock'), form: $('lockForm'), errEl: $('lockErr'),
  inputs: [...document.querySelectorAll('.pin input')],
  onOpen: async (tiers) => {
    TIERS = tiers;
    for (const t of TIERS) TIER_HASH[t.code] = await SiriaiVault.tierHash(t.code);
    try { token = localStorage.getItem(TOKEN_KEY) || ''; ghUser = localStorage.getItem(TOKEN_KEY + '-user') || ''; } catch {}
    $('app').hidden = false;
    renderGh();
    try { await loadData(); }
    catch (e) {
      if (e.status === 401) { token = ''; try { localStorage.removeItem(TOKEN_KEY); } catch {} renderGh(); toast('GitHub 연결이 만료됐어요. 다시 연결해주세요.', true); }
      try { DATA = await (await fetch('brands.json?t=' + Date.now(), { cache:'no-store' })).json(); } catch {}
    }
    DATA.brands ||= []; DATA.pastBrands ||= [];
    renderSheetCard(); renderList(); renderPast();
  },
});
</script>
